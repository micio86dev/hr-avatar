; nginx and php-fpm share one container. Either process exiting ends the container, so the
; platform restarts it instead of leaving a half-dead one serving 502s behind a green healthcheck.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -e /dev/stderr -g "daemon off;"
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:quit_on_exit]
command=sh -c 'printf "READY\n"; while read -r line; do kill -SIGQUIT $PPID; done'
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
