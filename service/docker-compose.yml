# Local development stack: PostgreSQL, Redis and the api, worker and scheduler services.
# One image serves all three application services; build it with `docker compose build api`.
# Host ports are overridable (HRA_DB_PORT, HRA_REDIS_PORT, HRA_API_PORT) when the defaults are taken.
# Secrets come from the environment or from service/.env. The one literal in this file is the local-development
# database password default (`postgres`, HRA_DB_PASSWORD): the published ports are bound to 127.0.0.1, and this
# file is never a deployment (Railway is configured by the railway*.json files). Set HRA_DB_PASSWORD on a shared host.

x-app: &app
  image: hra-service:local
  environment: &app-environment
    APP_ENV: ${APP_ENV:-local}
    APP_KEY: ${APP_KEY}
    HRA_JWT_SECRET: ${HRA_JWT_SECRET}
    HRA_PUBLIC_BASE_URL: ${HRA_PUBLIC_BASE_URL:-http://localhost:8100}
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: hra
    DB_USERNAME: postgres
    DB_PASSWORD: ${HRA_DB_PASSWORD:-postgres}
    DB_SSLMODE: ${DB_SSLMODE:-prefer}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
  depends_on: &app-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: hra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HRA_DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${HRA_DB_PORT:-55432}:5432"
    volumes:
      - hra-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.0-alpine
    ports:
      - "127.0.0.1:${HRA_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    build: .
    ports:
      - "127.0.0.1:${HRA_API_PORT:-8100}:8000"

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work"]
    depends_on:
      <<: *app-depends-on
      api:
        condition: service_started

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      <<: *app-depends-on
      api:
        condition: service_started

volumes:
  hra-pgdata:
